[tool.poetry]
name = "kokotoba-ai"
version = "0.1.0"
description = "発話カードを生成するKokotoba API"
authors = []
package-mode = false

[tool.poetry.dependencies]
python = ">=3.14,<3.15"
fastapi = "0.139.2"
litert-lm-api = "0.14.0"
numpy = "2.5.1"
openai = "^3.5.0"
pydantic = "2.13.4"
psycopg = {version = "3.2.10", extras = ["binary"]}
sentence-transformers = "5.6.0"
uvicorn = "0.51.0"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
